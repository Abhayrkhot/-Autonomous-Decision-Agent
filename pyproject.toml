[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real service integration", "stress: bounded load and concurrency", "live: optional paid provider smoke"]
[tool.coverage.run]
branch = true
source = ["app", "scripts"]
[tool.coverage.report]
show_missing = true
fail_under = 100
[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
