name: verify
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: agent
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/verify.sh
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install pip-audit==2.10.1
      # The image installs requirements.lock with --require-hashes; audit exactly that set.
      - run: pip-audit --strict --require-hashes --disable-pip -r requirements.lock
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash e2e/run.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e-out/report.json
            e2e-out/*.log
          if-no-files-found: ignore
